spring:
  cloud:
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
  eureka:
    client:
      enabled: false
    instance:
      prefer-ip-address: false
  security:
    user:
      name: test
      password: test
      roles: USER,ADMIN
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging:
  level:
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF
    org.springframework.security: DEBUG
