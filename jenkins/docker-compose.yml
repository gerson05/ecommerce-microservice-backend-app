version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk11
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/local/bin/docker-compose:/usr/local/bin/docker-compose
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_ADMIN_ID=admin
      - JENKINS_ADMIN_PASSWORD=admin123
    networks:
      - jenkins-network
    command: >
      bash -c "
        echo 'Installing Maven...' &&
        apt-get update &&
        apt-get install -y wget &&
        wget -O maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.8.6/binaries/apache-maven-3.8.6-bin.tar.gz &&
        tar -xzf maven.tar.gz -C /opt &&
        ln -s /opt/apache-maven-3.8.6 /opt/maven &&
        echo 'export MAVEN_HOME=/opt/maven' >> /etc/environment &&
        echo 'export PATH=\$MAVEN_HOME/bin:\$PATH' >> /etc/environment &&
        rm maven.tar.gz &&
        echo 'Maven installed successfully' &&
        /usr/local/bin/jenkins.sh
      "

  jenkins-agent:
    image: jenkins/inbound-agent:latest
    container_name: jenkins-agent
    depends_on:
      - jenkins
    environment:
      - JENKINS_URL=http://jenkins:8080
      - JENKINS_SECRET=agent-secret
      - JENKINS_AGENT_NAME=agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    networks:
      - jenkins-network

volumes:
  jenkins_home:

networks:
  jenkins-network:
    driver: bridge



